apiVersion: 1
datasources:
  # Managed Flink metrics, including the InfluxDB connector's write calls and latency percentiles.
  # Credentials come from the Grafana task's IAM role (read-only CloudWatch access).
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION}
