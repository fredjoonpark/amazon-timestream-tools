apiVersion: 1
datasources:
  - name: InfluxDB 3
    uid: influxdb3
    type: influxdb
    access: proxy
    isDefault: true
    url: ${INFLUX_URL}
    jsonData:
      version: SQL
      dbName: ${INFLUX_DB}
      httpMode: POST
      insecureGrpc: false
    secureJsonData:
      token: ${INFLUX_TOKEN}
